<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famicom Cartridge Tool</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1e;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app { width: 100vw; height: 100vh; }
      #app canvas { display: block; }
      #drop-hint {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(30, 100, 200, 0.25);
        border: 3px dashed #6af;
        color: #fff;
        font-size: 24px;
        pointer-events: none;
        z-index: 10;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #aaa;
        font-size: 12px;
        pointer-events: none;
        z-index: 5;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="drop-hint">Drop STL / HDR file to load</div>
    <div id="status"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
