<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famicom Cartridge Tool</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1e;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app { width: 100vw; height: 100vh; }
      #app canvas { display: block; }
      #drop-hint {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(30, 100, 200, 0.25);
        border: 3px dashed #6af;
        color: #fff;
        font-size: 24px;
        pointer-events: none;
        z-index: 10;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #aaa;
        font-size: 12px;
        pointer-events: none;
        z-index: 5;
        text-shadow: 0 1px 2px #000;
      }
      #credit {
        position: fixed;
        right: 12px;
        bottom: 10px;
        color: #888;
        font-size: 11px;
        z-index: 5;
        text-shadow: 0 1px 2px #000;
      }
      #credit a { color: #7ab; }
      #links {
        position: fixed;
        left: 12px;
        top: 10px;
        display: flex;
        gap: 10px;
        z-index: 5;
      }
      #links a {
        color: #bbb;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        text-decoration: none;
      }
      #links a:hover { color: #fff; }
      #links svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="drop-hint">Drop STL / HDR file to load</div>
    <div id="status"></div>
    <div id="links">
      <a href="https://github.com/GOROman/famicom-cartridge-tool" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <a href="https://x.com/GOROman" target="_blank" rel="noopener" title="X @GOROman">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.4Z"/></svg>
        <span>@GOROman</span>
      </a>
    </div>
    <div id="credit">
      Base model: <a href="https://www.thingiverse.com/thing:3357677" target="_blank" rel="noopener">"Dendy (Famicom) cartridge"</a>
      by <a href="https://www.thingiverse.com/5rw" target="_blank" rel="noopener">5rw</a> /
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY</a>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
